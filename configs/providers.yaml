# Provider registry for remote model roles (PROVIDERS-REGISTRY card, 2026-08-14).
# Plus model-centric local registry (local-model-aliases, 2026-09): top-level role_budgets
# shared by local & remote, and per-model sampling in providers.local.models.<alias>.request.
#
# CLI usage:
#   Remote: --translator <provider>/<alias> e.g. opencode-go/musefree  --reviewer openai/luna
#   Local:  --local (gemma/qwen) | --local translator/reviewer  e.g. --local glm/glimmer
#           where both components are local aliases (case-insensitive, no provider slash).
#
# Fixed shared role groups (local & remote):
#   translator = generator, repair, formatting, gemma_audit
#   reviewer   = qwen_audit, fidelity_reviewer, russian_selector, entity_extractor, russian_editor, glossary_resolver
# Every role is bound explicitly to its group model; no role->role or default fallback.
#
# Local model owns: model_key, model_path, model_name, server_args, reasoning_budget, request{temperature,top_p,top_k,min_p,seed}
# Role budgets own only max_output_tokens / output_budget. Request must NOT contain max_output_tokens.
# Sampling is excluded from run identity (same output dir) but INCLUDED in each request cache key/provenance.
role_budgets:
  generator: {max_output_tokens: 70000}
  repair: {max_output_tokens: 16384, output_budget: {mode: floor_plus_per_item, floor_tokens: 16384, per_item_tokens: 128, ceiling: 24576}}
  formatting: {max_output_tokens: 8000, output_budget: {mode: span_formula, base_tokens: 8000, per_span_tokens: 64, ceiling: 24576}}
  gemma_audit: {max_output_tokens: 4096}
  qwen_audit: {max_output_tokens: 12000, output_budget: {mode: floor_plus_per_item, floor_tokens: 12000, per_item_tokens: 128, ceiling: 24576}}
  fidelity_reviewer: {max_output_tokens: 16384, output_budget: {mode: floor_plus_per_item, floor_tokens: 16384, per_item_tokens: 128, ceiling: 24576}}
  russian_selector: {max_output_tokens: 1024}
  entity_extractor: {max_output_tokens: 12000}
  russian_editor: {max_output_tokens: 12000}
  glossary_resolver: {max_output_tokens: 4096}
providers:
  opencode-go:
    kind: opencode_server
    models:
      deepseek4flash:
        ref: opencode-go/deepseek-v4-flash
        reasoning_contract:
          variants: [low, high, max]
      qwen37:
        ref: opencode-go/qwen3.7-plus
        reasoning_contract:
          variants: [high, max]
      muse:
        ref: opencode-go/muse-spark-1.2-contributor
        reasoning_contract:
          variants: [minimal, low, medium, high, xhigh]
      musefree:
        ref: opencode/muse-spark-1.2-contributor-free
        reasoning_contract:
          variants: [minimal, low, medium, high, xhigh]
      hy3free:
        ref: opencode/hy3-free
        reasoning_contract:
          variants: [low, medium, high]
      oxfree:
        ref: opencode-go/ox-alpha-free
        reasoning_contract:
          variants: [low, high, max]
  local:
    kind: local_llama
    models:
      gemma:
        model_key: gemma
        model_path: C:/llama-cpp/models/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
        model_name: gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
        server_args: [-ngl, "99", -ncmoe, "18", --load-mode, mmap, --reasoning-budget, "2048", -np, "1", -c, "49152", -fa, "on", --jinja, -ctk, q8_0, -ctv, q4_0, --cache-ram, "0", --ctx-checkpoints, "0"]
        reasoning_budget: 2048
        request: {temperature: 0.2, seed: 7}
      qwen:
        model_key: qwen
        model_path: C:/llama-cpp/models/Qwen3.6-35B-A3B-MTP/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
        model_name: Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
        server_args: [--spec-type, draft-mtp, --spec-draft-n-max, "3", --device, SYCL0, -fit, "on", -fitt, "1280", -b, "2048", -ub, "512", -ctk, q8_0, -ctv, q4_0, -t, "6", -tb, "12", --load-mode, mmap, --reasoning, "on", --reasoning-budget, "8192", -np, "1", -c, "49152", -fa, "on", --jinja, --cache-ram, "0", --ctx-checkpoints, "0"]
        reasoning_budget: 8192
        request: {temperature: 0.0}
  openai:
    kind: opencode_server
    models:
      luna:
        ref: openai/gpt-5.6-luna
        reasoning_contract:
          variants: [none, low, medium, high, xhigh, max]
      sol:
        ref: openai/gpt-5.6-sol
        reasoning_contract:
          variants: [none, low, medium, high, xhigh, max]
      terra:
        ref: openai/gpt-5.6-terra
        reasoning_contract:
          variants: [none, low, medium, high, xhigh, max]
