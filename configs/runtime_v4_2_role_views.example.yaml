# v4.2 DEV PROFILE — book-memory role views (separate from unchanged v4.1).
#
# This profile is a copy of the canonical remote opencode_server profile with the
# SINGLE v4.2 deviation: it is the runtime the owner uses to test the
# book-memory-role-views feature (v4.2) WITHOUT disturbing the production v4.1
# profile (runtime_remote.example.yaml).
#
# How to run v4.2:
#   PACT_V4_2_ROLE_VIEWS=1 python -m pact_full_pipeline_runner_v1.v4_run book \
#       --chapters 0001 \
#       --runtime-config configs/runtime_v4_2_role_views.example.yaml
#
# The env var flips StrictRunnerConfig.book_memory_role_views_enabled=True, which:
#   * computes select_relevant ONCE per chapter (causal source-relevance),
#   * projects bounded role views (translator / audit_repair / russian_editor /
#     glossary) into the real whole-chapter consumers,
#   * leaves the default v4.1 path (env var unset) byte-identical.
#
# No credentials or host-specific model paths are stored here. Authentication is
# via environment-variable names only; Pact resolves values at startup and never
# persists them.
kind: opencode_server
server_mode: external
base_url: http://127.0.0.1:4097
server_version_policy: compatible_minor
pinned_server_version: latest
auth:
  type: basic_env
  username_env: OPENCODE_SERVER_USERNAME
  password_env: OPENCODE_SERVER_PASSWORD
structured_output_mode: prompt_only
timeout_seconds: 900
remote_budget:
  max_requests_per_chapter: 500
reasoning: 3
model_bindings:
  generator: opencode/muse-spark-1.2-contributor-free
  fidelity_reviewer: openai/gpt-5.6-luna
  russian_selector: openai/gpt-5.6-luna
  qwen_audit: openai/gpt-5.6-luna
  entity_extractor: openai/gpt-5.6-luna
  gemma_audit: opencode-go/deepseek-v4-flash
  repair: opencode/muse-spark-1.2-contributor-free
reasoning_effort_map:
  1: low
  2: medium
  3: high
