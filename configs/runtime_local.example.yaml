# V4 C3 example: local llama-server profile (no secrets).
#
# Mirrors the historical local strict default of
# pact_full_pipeline_runner_v1/v4_phase12_strict_run.py (SYCL profile
# validated in Measurement 2). Running the CLI without --runtime-config
# already uses exactly this profile; this file is the config-form equivalent.
#
# Paths below are the validated values already documented in the CLI -- edit
# them to match your environment. No credentials appear in this file.
kind: local_llama
# V4.1 §3.4 (2026-08-09): sycl-edge build (reasoning-budget 2048 works; MTP off).
exe: C:/src/llama-sycl-edge/build/bin/llama-server.exe
device: SYCL0
host: 127.0.0.1
port: 8094
startup_timeout: 240.0
unload_timeout: 30.0
model_paths:
  gemma: C:/llama-cpp/models/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
  qwen: C:/llama-cpp/models/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
model_names:
  gemma: gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
  qwen: Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
server_args:
  gemma:
    # V4.1 (2026-08-09): sycl-edge build, контекст 49k.
    # Бинарь: C:\src\llama-sycl-edge\build\bin\llama-server.exe (env
    # GGML_SYCL_FA_DECODE_KERNEL=auto, -dev SYCL0 задаются при запуске —
    # см. план V4_1_WHOLE_CHAPTER_ARCHITECTURE_PLAN_RU.md §3.4).
    #
    # V4.1 A2 RV fix: the local generator's reasoning budget travels via
    # --reasoning-budget in the server args, so the CLI value and this arg
    # MUST agree. The CLI default path (no --runtime-config) DERIVES the
    # budget from --reasoning: 2048 (§3.4, the supported A2 profile) for
    # --reasoning>0 and 0 (B1 baseline) for the default --reasoning 0.
    # A static profile pins one value: set 0 here for baseline runs, or 2048
    # for A2 whole-chapter runs (validate_reasoning_backend fails closed on
    # any mismatch between --reasoning and this arg).
    - -ngl
    - "99"
    - -ncmoe
    - "18"
    - --load-mode
    - mmap
    - --reasoning-budget
    - "0"
    - -np
    - "1"
    - -c
    - "49152"
    - -fa
    - "on"
    - --jinja
    - -ctk
    - q8_0
    - -ctv
    - q4_0
    - --cache-ram
    - "0"
    - --ctx-checkpoints
    - "0"
  qwen:
    - -fit
    - "on"
    - -fitt
    - "1280"
    - -b
    - "2048"
    - -ub
    - "512"
    - -ctk
    - q8_0
    - -ctv
    - q8_0
    - -t
    - "6"
    - -tb
    - "12"
    - --load-mode
    - mmap
    - --reasoning-budget
    - "0"
    - -np
    - "1"
    - -c
    - "32768"
    - -fa
    - "on"
    - --jinja
    - --cache-ram
    - "0"
    - --ctx-checkpoints
    - "0"
