# Canonical local llama-server profile (config-form).
# This is the identity-bearing profile for local runs via --runtime-config.
# Without --runtime-config the strict CLI uses the historical no-config
# identity and transport unchanged — this file does not replace it.
#
# Edit paths/host/port to match the execution host. No credentials in this file.
# All policy that affects model behavior is explicit here; code defaults are
# compatibility fallbacks only.
kind: local_llama
exe: C:/src/llama-sycl-edge/build/bin/llama-server.exe
device: SYCL0
host: 127.0.0.1
port: 8094
startup_timeout: 240.0
unload_timeout: 30.0
model_paths:
  gemma: C:/llama-cpp/models/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
  qwen: C:/llama-cpp/models/Qwen3.6-35B-A3B-MTP/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
model_names:
  gemma: gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
  qwen: Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
server_args:
  gemma:
    - -ngl
    - "99"
    - -ncmoe
    - "18"
    - --load-mode
    - mmap
    - --reasoning-budget
    - "2048"
    - -np
    - "1"
    - -c
    - "49152"
    - -fa
    - "on"
    - --jinja
    - -ctk
    - q8_0
    - -ctv
    - q4_0
    - --cache-ram
    - "0"
    - --ctx-checkpoints
    - "0"
  qwen:
    - --spec-type
    - draft-mtp
    - --spec-draft-n-max
    - "3"
    - --device
    - SYCL0
    - -fit
    - "on"
    - -fitt
    - "1280"
    - -b
    - "2048"
    - -ub
    - "512"
    - -ctk
    - q8_0
    - -ctv
    - q4_0
    - -t
    - "6"
    - -tb
    - "12"
    - --load-mode
    - mmap
    - --reasoning
    - "on"
    - --reasoning-budget
    - "8192"
    - -np
    - "1"
    - -c
    - "49152"
    - -fa
    - "on"
    - --jinja
    - --cache-ram
    - "0"
    - --ctx-checkpoints
    - "0"
