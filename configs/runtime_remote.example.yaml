# Canonical remote opencode_server profile — portable, policy-bearing.
# No credentials or host-specific model paths in this file. Authentication
# is via environment-variable names only; Pact resolves values at startup
# and never persists them. Copy this file to the execution host and set
# the declared env vars there.
#
# All identity-bearing policy is explicit here: role model bindings,
# reasoning policy, timeout, remote budget, and structured-output policy.
# Code defaults are compatibility fallbacks; omitted overrides use profile values.
# Optional invocation overrides: --translator / --reviewer (provider/alias)
# and --reasoning {0,1,2,3} (reasoning level) when supplied replace these defaults.
kind: opencode_server
server_mode: external
base_url: http://127.0.0.1:4097
server_version_policy: compatible_minor
pinned_server_version: latest
auth:
  type: basic_env
  username_env: OPENCODE_SERVER_USERNAME
  password_env: OPENCODE_SERVER_PASSWORD
structured_output_mode: prompt_only
timeout_seconds: 900
remote_budget:
  max_requests_per_chapter: 500
reasoning: 3
model_bindings:
  generator: opencode/muse-spark-1.2-contributor-free
  fidelity_reviewer: openai/gpt-5.6-luna
  russian_selector: openai/gpt-5.6-luna
  qwen_audit: openai/gpt-5.6-luna
  entity_extractor: openai/gpt-5.6-luna
  gemma_audit: opencode-go/deepseek-v4-flash
  repair: opencode/muse-spark-1.2-contributor-free
reasoning_effort_map:
  1: low
  2: medium
  3: high
