# V4 C3 example: fully remote profile over an `opencode serve` endpoint
# (no secrets).
#
# Auth is via environment variables only (plan §12): OPENCODE_SERVER_USERNAME
# / OPENCODE_SERVER_PASSWORD are the basic-auth pair of the serve endpoint.
# Pact reads the values from the environment at backend construction time and
# never persists them. Edit the env-var names if your endpoint uses different
# ones; never put the values themselves in this file.
#
# server_mode:
#   external -- talk to a pre-started `opencode serve` on base_url;
#   managed  -- Pact starts its own `opencode serve` (pinned version) and
#               stops it after the run. Equivalent to `--managed-server`.
#
# V4.1 experiment flags (CLI, not this file):
#   --reasoning {0,1,2,3}  -- Phase 2B generation reasoning budget only
#       (0=off baseline, 1=low, 2=medium, 3=high). Sent to the remote
#       provider as the top-level `reasoningEffort` on each generation
#       request; the Qwen audit / repair / formatting phases are untouched.
#   --stop-after-generation -- halt right after Phase 1-2 (generation +
#       selection): the chunked translation lands in translations.json and
#       step6/step7/step8 are recorded as skipped_stop_after_generation.
#   Both flags are part of the run's config identity, so such a run needs a
#   NEW --out-dir (a prior out-base is NOT resumable under the new identity).
#
# Running this profile sends the chapter text to the remote provider(s)
# referenced by the model_bindings (plan §12 acknowledgement).
kind: opencode_server
server_mode: external
# Port of the opencode serve endpoint. In managed mode (--managed-server /
# server_mode: managed) this is the port Pact binds its OWN server to, so it
# must be free: 4096 is commonly taken by other tools' opencode servers, so
# the example uses 4097.
base_url: http://127.0.0.1:4097
server_version_policy: compatible_minor
pinned_server_version: 1.4.7
auth:
  type: basic_env
  username_env: OPENCODE_SERVER_USERNAME
  password_env: OPENCODE_SERVER_PASSWORD
structured_output_mode: prompt_only
# TIMEOUT-FIX (2026-08-13): whole-chapter generation with --reasoning 3
# (high) routinely takes >10 min (run_remote_003: attempt 2 was cut at
# exactly 600s, 003 streamed for 10+ min). 2400s = 40 min transport budget
# per HTTP request so long generations are not aborted. This is an
# IDENTITY parameter (build_opencode_descriptor serializes timeout_seconds):
# changing it invalidates cache/resume — change it only BETWEEN runs (like
# --run-label), never mid-run.
timeout_seconds: 2400
# Remote budget (B11): max_requests_per_chapter caps model requests per
# chapter (full cycle ~350-400 incl. convergence/repair/formatting/
# quarantined-retry; default 500 keeps a reserve). This is an
# IDENTITY parameter — changing it invalidates cache/resume, so change it
# only BETWEEN runs (like --run-label), never mid-run.
remote_budget:
  max_requests_per_chapter: 500
model_bindings:
  generator: opencode-go/deepseek-v4-flash
  fidelity_reviewer: opencode-go/qwen3.7-plus
  russian_selector: opencode-go/qwen3.7-plus
  qwen_audit: opencode-go/qwen3.7-plus
  gemma_audit: opencode-go/deepseek-v4-flash
  # Phase 4A region repair (B2). Falls back to `generator` when unset.
  repair: opencode-go/deepseek-v4-flash
